name: Build Confidence Monitor Windows Installer

on:
  push:
    branches:
      - feat-confidence-monitor

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.304.1
          install_runtime: false
          cache: true

      - name: Put glslc on PATH
        shell: bash
        run: |
          set -euo pipefail
          for cand in "${VULKAN_SDK}/Bin" "${VULKAN_SDK}/bin"; do
            if [[ -d "${cand}" ]]; then
              echo "${cand}" >> "$GITHUB_PATH"
            fi
          done

      - name: Install SPIRV-Headers
        shell: bash
        run: |
          set -euo pipefail
          VCPKG_ROOT_DIR="$(dirname "$(command -v vcpkg)")"
          "${VCPKG_ROOT_DIR}/vcpkg" install spirv-headers:x64-windows
          echo "CMAKE_PREFIX_PATH=${VCPKG_ROOT_DIR}/installed/x64-windows" >> "$GITHUB_ENV"

      - name: Build whisper STT payload
        run: npm run build:whisper-binaries

      - name: Build Windows installer
        run: npm run build:win -- --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: openscreen-confidence-monitor-windows
          path: |
            release/**/Openscreen.Setup.*.exe
            release/**/Openscreen.Setup.*.exe.blockmap
            release/**/latest.yml
          if-no-files-found: error
          retention-days: 30
